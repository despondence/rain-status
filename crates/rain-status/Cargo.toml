[package]
name = "rain-status"
version.workspace = true
edition.workspace = true

[dependencies]
discord-ipc.workspace = true
rain-media.workspace = true
reqwest = { version = "0.13.4", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "http2", "json", "rustls", "zstd"] }
serde = { workspace = true, default-features = false, features = ["derive", "std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
url = "2.5.8"
urlencoding = { version = "2.1.3", default-features = false }
